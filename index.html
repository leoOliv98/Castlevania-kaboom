<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Protótipo Castlevania - Kaboom.js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script type="module">
        import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

        kaboom({
            background: [20, 20, 30],
            width: 800,
            height: 600,
            letterbox: true, 
            stretch: true,   
        });

        // 1. CARREGAMENTO DOS ASSETS
        loadSprite("background_fase1", "frontend/assets/sprites/fundo-castelo.png");
        
        loadSprite("player", "frontend/assets/sprites/Personagem-Principal-andando.png", {
            sliceX: 6,
            sliceY: 1,
            anims: {
                "idle": { from: 0, to: 0 }, 
                "walk": { from: 0, to: 5, speed: 12, loop: true }
            }
        }); 
        
        loadSprite("esqueleto", "frontend/assets/sprites/Esqueleto.png");

        loadSprite("tile_18", "frontend/assets/levels/tilesets/musgo-topo-esquerda.png");
        loadSprite("tile_15", "frontend/assets/levels/tilesets/musgo-topo-1.png");
        loadSprite("tile_17", "frontend/assets/levels/tilesets/musgo-topo-direita.png");
        loadSprite("tile_14", "frontend/assets/levels/tilesets/musgo-centro-esquerda.png");
        loadSprite("tile_11", "frontend/assets/levels/tilesets/musgo-centro-1.png");
        loadSprite("tile_13", "frontend/assets/levels/tilesets/musgo-centro-direita.png");
        loadSprite("tile_16", "frontend/assets/levels/tilesets/musgo-topo-2.png");

        // --- CENA: MENU INICIAL ---
        scene("menu", () => {
            // Fundo escuro simples para o menu
            add([
                rect(width(), height()),
                color(10, 10, 20),
                pos(0, 0)
            ]);

            // Título do Jogo
            add([
                text("SUPER MAILSON", { size: 64, font: "sans-serif" }),
                pos(center().x, center().y - 80),
                anchor("center"),
                color(200, 30, 30) // Cor vermelha estilo dark fantasy
            ]);

            add([
                text("O Despertar do Mago", { size: 32, font: "sans-serif" }),
                pos(center().x, center().y - 20),
                anchor("center"),
                color(255, 255, 255)
            ]);

            // Instrução piscante para iniciar
            const startText = add([
                text("Pressione ENTER para Jogar", { size: 24 }),
                pos(center().x, center().y + 80),
                anchor("center"),
                color(150, 150, 150)
            ]);

            // Efeito visual: Faz o texto piscar usando a função wave() ligada ao tempo
            startText.onUpdate(() => {
                startText.opacity = wave(0.2, 1, time() * 3);
            });

            // Adiciona um esqueleto de enfeite na tela de título
            add([
                sprite("esqueleto"),
                pos(center().x, center().y + 180),
                anchor("center"),
                scale(0.3)
            ]);

            // Transição para o jogo ao apertar Enter ou Espaço
            onKeyPress("enter", () => {
                go("game");
            });
            onKeyPress("space", () => {
                go("game");
            });
        });

        // --- CENA: JOGO (Fase 1) ---
        scene("game", async () => {
            setGravity(2400);

            const response = await fetch("frontend/assets/levels/level-1.tmj");
            const mapJson = await response.json();

            const tileLayer = mapJson.layers.find(layer => layer.type === "tilelayer");
            const mapData = tileLayer.data; 
            const mapWidth = mapJson.width; 
            const tileW = mapJson.tilewidth; 
            const tileH = mapJson.tileheight; 

            mapData.forEach((tileId, index) => {
                if (tileId !== 0) { 
                    const x = (index % mapWidth) * tileW;
                    const y = Math.floor(index / mapWidth) * tileH;

                    add([
                        sprite(`tile_${tileId}`), 
                        pos(x, y),
                        area(),
                        body({ isStatic: true }), 
                        "ground"
                    ]);
                }
            });

            const objectLayer = mapJson.layers.find(layer => layer.type === "objectgroup");
            
            let spawnPlayerX = 150;
            let spawnPlayerY = 100;
            let spawnEnemyX = 500;
            let spawnEnemyY = 100;

            if (objectLayer && objectLayer.objects) {
                const pObj = objectLayer.objects.find(obj => obj.name === "player_spawn");
                if (pObj) {
                    spawnPlayerX = pObj.x;
                    spawnPlayerY = pObj.y;
                }

                const eObj = objectLayer.objects.find(obj => obj.name === "enemy_spawn");
                if (eObj) {
                    spawnEnemyX = eObj.x;
                    spawnEnemyY = eObj.y;
                }
            }

            add([
                sprite("background_fase1"),
                pos(-200, -300),
                z(-100),     
                scale(3),    
            ]);

            const larguraTotalMapa = mapWidth * tileW;
            add([ rect(16, 2000), pos(-16, -500), area(), body({ isStatic: true }), opacity(0) ]);
            add([ rect(16, 2000), pos(larguraTotalMapa, -500), area(), body({ isStatic: true }), opacity(0) ]);
            add([ rect(larguraTotalMapa + 400, 100), pos(-200, 1100), area(), body({ isStatic: true }), opacity(0), "deathZone" ]);

            const player = add([
                sprite("player", { anim: "idle" }),
                pos(spawnPlayerX, spawnPlayerY),
                area(),
                body(),
                scale(0.35), 
                anchor("center"),
                "player" 
            ]);

            const enemy = add([
                sprite("esqueleto"),
                pos(spawnEnemyX + 450, spawnEnemyY),
                area(),
                body(),
                scale(0.17),
                anchor("center"),
                "enemy"
            ]);

            player.onCollide("deathZone", () => {
                player.pos = vec2(spawnPlayerX, spawnPlayerY);
                player.vel = vec2(0, 0);
                camPos(player.pos);
                player.play("idle");
            });

            const SPEED = 300;
            const JUMP_FORCE = 1100;

            onKeyDown("left", () => {
                player.move(-SPEED, 0);
                player.flipX = true; 
                if (player.isGrounded() && player.curAnim() !== "walk") {
                    player.play("walk"); 
                }
            });

            onKeyDown("right", () => {
                player.move(SPEED, 0);
                player.flipX = false; 
                if (player.isGrounded() && player.curAnim() !== "walk") {
                    player.play("walk");
                }
            });

            onKeyRelease("left", () => {
                if (!isKeyDown("right")) player.play("idle");
            });

            onKeyRelease("right", () => {
                if (!isKeyDown("left")) player.play("idle");
            });

            onKeyPress("up", () => {
                if (player.isGrounded()) {
                    player.jump(JUMP_FORCE);
                    player.play("idle"); 
                }
            });

            player.onUpdate(() => {
                const targetPos = player.pos;
                const currentCam = camPos();
                camPos(currentCam.lerp(targetPos, 0.2));
            });
        });

        // 3. INICIA O JOGO PELA CENA DO MENU
        go("menu");
    </script>
</body>
</html>

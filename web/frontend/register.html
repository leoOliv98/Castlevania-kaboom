<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GameHost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Criar Conta</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="new-username">Usuário</label>
                    <input type="text" id="new-username" oninput="this.value = this.value.replace(/\s/g, '');" required placeholder="Escolha um usuário">
                </div>
                <div class="input-group">
                    <label for="new-email">E-mail</label>
                    <input type="email" id="new-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="new-password">Senha</label>
                    <input type="password" id="new-password" required placeholder="Crie uma senha forte">
                </div>
                <button type="submit" class="btn-login">Cadastrar</button>
            </form>
            <p class="register-link">Já tem uma conta? <a href="index.html">Faça login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

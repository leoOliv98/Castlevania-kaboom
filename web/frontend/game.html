<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo - GameHost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">GameHost - Área de Jogo</div>
        <div class="nav-user">
            Guerreiro(a): <span id="display-username">Aventureiro</span>
            <a href="main.html" class="btn-logout">Voltar ao Painel</a>
        </div>
    </nav>

    <main class="main-content" style="text-align: center;">
        <h1>Masmorra em Desenvolvimento</h1>
        <p>Aqui rodará o seu jogo de pixel art / Kaboom.js!</p>
        <!-- Canvas ou área do jogo -->
        <div style="margin-top: 2rem; border: 2px solid var(--gold); height: 400px; display: flex; align-items: center; justify-content: center; background: #000;">
            <span style="color: var(--gold-light); font-family: 'Cinzel', serif;">[ Canvas do Jogo Aqui ]</span>
        </div>
    </main>

    <!-- Script de Proteção e Identificação -->
    <script>
        // Verifica se o usuário está logado ao carregar a página do jogo
        const loggedUser = localStorage.getItem('loggedUser');

        if (!loggedUser) {
            // Se não houver sessão ativa, alerta e redireciona para o login
            alert('Acesso negado! Faça login para entrar na masmorra.');
            window.location.href = 'index.html';
        } else {
            // Exibe o nome do usuário logado na tela do jogo
            document.getElementById('display-username').textContent = loggedUser;
        }
    </script>
</body>
</html>

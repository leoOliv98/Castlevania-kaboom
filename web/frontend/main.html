<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Super Mailson</div>
        <div class="nav-user">
            Bem-vindo, <span id="display-username">Jogador</span>! 
            <a href="index.html" class="btn-logout" id="btn-logout">Sair</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1>Painel de Controle</h1>
            <p>Gerencie suas sessões e acompanhe os tempos de conclusão das fases.</p>
        </header>

        <!-- NOVO: Quadrado para ir direto para o jogo -->
        <section class="game-launcher-section">
            <a href="game.html" class="play-square">
                <span class="play-icon">▶</span>
                <span class="play-text">JOGAR AGORA</span>
            </a>
        </section>

        <section class="leaderboard-section">
            <h2>Top 10 - Melhores Tempos (Speedruns)</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Jogador</th>
                        <th>Tempo de Conclusão</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>#1</td><td>Overlodomaia</td><td>04:12.35</td></tr>
                    <tr><td>#2</td><td>leoOliv98</td><td>04:15.89</td></tr>
                    <tr><td>#3</td><td>Tio_Dani</td><td>05:02.11</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

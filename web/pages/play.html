<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mailson - Área de Jogo</title>
    <link rel="stylesheet" href="/css/portal.css">
    <link rel="stylesheet" href="/css/game-container.css">
</head>
<body>
    <!-- Barra Superior do GameHost (com verificação de usuário) -->
    <nav class="navbar">
        <div class="nav-brand">GameHost - Área de Jogo</div>
        <div class="nav-user">
            Guerreiro(a): <span id="display-username">Aventureiro</span>
            <a href="/dashboard.html" class="btn-logout">Voltar ao Painel</a>
        </div>
    </nav>

    <main class="game-page-content" style="text-align: center;">
        <h1>Super Mailson: O Despertar do Mago</h1>

        <!-- Container onde o Kaboom vai renderizar o jogo -->
        <div id="game-container"></div>
    </main>

    <!-- Script de Proteção (Login) -->
    <script>
        const loggedUser = localStorage.getItem('loggedUser');
        if (!loggedUser) {
            alert('Acesso negado! Faça login para entrar na masmorra.');
            window.location.href = '/login.html';
        } else {
            document.getElementById('display-username').textContent = loggedUser;
        }
    </script>

    <!-- 1º: Carrega a estrutura de dados do inventário -->
    <script src="/frontend/js/cenas/inventario.js"></script>

    <!-- 2º: Importa o main.js como módulo principal do jogo -->
    <script type="module" src="/frontend/js/main.js"></script>
</body>
</html>
